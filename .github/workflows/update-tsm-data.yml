# Fetch auction prices and push them so Vercel deploys with fresh data.
# Anniversary realms and WoW Forever come from TSM public CSVs.
name: Update Auction Prices

on:
  schedule:
    # Every hour. GitHub runs this in UTC.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch TSM data
        id: tsm
        continue-on-error: true
        run: |
          node src/scripts/get_TSM_data.mjs anniversary
          anniversary_status=$?
          node src/scripts/get_TSM_data.mjs forever
          forever_status=$?
          if [ "$anniversary_status" -ne 0 ] || [ "$forever_status" -ne 0 ]; then
            exit 1
          fi

      - name: Commit and push auction prices
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/prices/*.json
          git diff --staged --quiet || (git commit -m "chore: update auction prices [skip ci]" && git push)

      - name: Record Forever profession costs
        id: costs
        if: always() && !cancelled()
        continue-on-error: true
        run: npx tsx src/scripts/record_forever_profession_costs.ts

      - name: Commit and push profession cost history
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/profession-costs/forever.json
          git diff --staged --quiet || (git commit -m "chore: record forever profession leveling costs [skip ci]" && git push)

      - name: Fail if a price fetch or cost record failed
        if: steps.tsm.outcome == 'failure' || steps.costs.outcome == 'failure'
        run: exit 1
