# Fetch auction prices and push them so Vercel deploys with fresh data.
# Anniversary realms come from TSM public CSVs. Forever realms come from AHledger.
name: Update Auction Prices

on:
  schedule:
    # Every hour. GitHub runs this in UTC.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch TSM data
        id: tsm
        continue-on-error: true
        run: node src/scripts/get_TSM_data.mjs anniversary

      - name: Fetch AHledger data
        id: ahledger
        continue-on-error: true
        run: node src/scripts/get_ahledger_data.mjs

      - name: Commit and push if changed
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/prices/*.json
          git diff --staged --quiet || (git commit -m "chore: update auction prices [skip ci]" && git push)

      - name: Fail if a price fetch failed
        if: steps.tsm.outcome == 'failure' || steps.ahledger.outcome == 'failure'
        run: exit 1
